name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  CONTAINER_ENGINE: docker

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ci/check-version.sh "$GITHUB_REF_NAME"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Docs
        run: ci/container.sh ci/docs.sh

      - name: Package (RPM)
        run: ci/container.sh ci/package.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          cp build/docs.tar.gz "build/${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-docs.tar.gz"
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            build/rpm/SOURCES/*.tar.gz \
            build/rpm/SRPMS/*.rpm \
            build/rpm/RPMS/*/*.rpm \
            "build/${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}-docs.tar.gz"
